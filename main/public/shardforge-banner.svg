<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="55%" stop-color="#16181F" />
      <stop offset="100%" stop-color="#1E1316" />
    </linearGradient>
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" stop-opacity="0" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0" />
    </linearGradient>
    <style>
      .title { font: 800 38px 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #F4F4F5; letter-spacing: -0.02em; }
      .subtitle { font: 500 15px 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #A1A1AA; }
      .mono { font: 600 11px 'JetBrains Mono', monospace; fill: #E4E4E7; }
      .mono-muted { font: 500 10px 'JetBrains Mono', monospace; fill: #A1A1AA; }
      .badge-text { font: 700 11px 'JetBrains Mono', monospace; fill: #FCA5A5; letter-spacing: 0.06em; }
      @keyframes floatGem {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 160; opacity: 0.35; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.35; }
      }
      @keyframes cardPop {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .gem-anim { animation: floatGem 3.4s ease-in-out infinite; }
      .beam-anim { stroke-dasharray: 12 8; animation: pulseBeam 2.2s linear infinite; }
      .doc-anim { animation: cardPop 3.4s ease-in-out 0.6s infinite; }
    </style>
  </defs>

  <!-- Main Canvas -->
  <rect width="960" height="320" rx="16" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2" />

  <!-- Subtle Grid Lines -->
  <g stroke="#27272A" stroke-width="1" opacity="0.45">
    <line x1="0" y1="64" x2="960" y2="64" />
    <line x1="0" y1="256" x2="960" y2="256" />
    <line x1="500" y1="0" x2="500" y2="320" />
  </g>

  <!-- Left Side: Brand & Tagline -->
  <g transform="translate(48, 56)">
    <!-- Animated Polyhedral Emblem -->
    <g class="gem-anim">
      <rect x="0" y="0" width="54" height="54" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1.5" />
      <g transform="translate(9, 9)">
        <path d="M18 3L30 10.5V25.5L18 33L6 25.5V10.5L18 3Z" stroke="#DC2626" stroke-width="2" stroke-linejoin="round" fill="none" />
        <path d="M18 3L24 15L18 33L12 15L18 3Z" fill="#991B1B" fill-opacity="0.45" stroke="#F4F4F5" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M6 10.5L18 15L30 10.5M6 25.5L18 21L30 25.5" stroke="#F4F4F5" stroke-width="1.2" stroke-opacity="0.65" fill="none" />
      </g>
    </g>

    <!-- Kicker -->
    <rect x="68" y="13" width="256" height="26" rx="5" fill="#291416" stroke="#7F1D1D" stroke-width="1" />
    <text x="80" y="30" class="badge-text">5ETOOLS → SHARD TABLETOP .DOCX</text>

    <!-- Title & Subtitle -->
    <text x="0" y="108" class="title">ShardForge</text>
    <text x="0" y="138" class="subtitle">Browse the live 5eTools website &amp; convert any Monster,</text>
    <text x="0" y="160" class="subtitle">Spell, Item, or Class into a Shard Tabletop .docx in 1 click.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="124" height="26" rx="4" fill="#18181B" stroke="#27272A" />
      <text x="12" y="17" class="mono">✓ Live 5eTools</text>

      <rect x="134" y="0" width="138" height="26" rx="4" fill="#18181B" stroke="#27272A" />
      <text x="146" y="17" class="mono">✓ 1-Click .docx</text>

      <rect x="282" y="0" width="150" height="26" rx="4" fill="#18181B" stroke="#27272A" />
      <text x="294" y="17" class="mono">✓ Auto Tag Clean</text>
    </g>
  </g>

  <!-- Right Side: Animated Live 5eTools -> Shard .docx Visual Diagram -->
  <g transform="translate(534, 46)">
    <!-- Mini 5eTools Browser Card -->
    <rect x="0" y="20" width="166" height="188" rx="8" fill="#14161B" stroke="#3F3F46" stroke-width="1.5" />
    <rect x="0" y="20" width="166" height="26" rx="8" fill="#1F2229" />
    <circle cx="14" cy="33" r="3.5" fill="#EF4444" />
    <circle cx="25" cy="33" r="3.5" fill="#F59E0B" />
    <circle cx="36" cy="33" r="3.5" fill="#10B981" />
    <text x="52" y="37" class="mono-muted">5etools/classes</text>

    <!-- Selected Row Highlight -->
    <rect x="12" y="58" width="142" height="26" rx="4" fill="#27272A" stroke="#DC2626" stroke-width="1" />
    <text x="20" y="75" class="mono">Barbarian · PHB</text>

    <rect x="12" y="92" width="142" height="22" rx="4" fill="#18181B" />
    <text x="20" y="107" class="mono-muted">Fireball · 3rd Evoc.</text>

    <rect x="12" y="120" width="142" height="22" rx="4" fill="#18181B" />
    <text x="20" y="135" class="mono-muted">Vorpal Sword · DMG</text>

    <!-- Floating In-Iframe Convert Button -->
    <rect x="24" y="166" width="130" height="28" rx="5" fill="#991B1B" />
    <text x="41" y="184" class="mono">Download .docx</text>

    <!-- Animated Stream Beam -->
    <line x1="170" y1="114" x2="226" y2="114" stroke="#EF4444" stroke-width="2.5" class="beam-anim" />
    <polygon points="224,109 233,114 224,119" fill="#EF4444" />

    <!-- Animated Shard .docx Manuscript Card -->
    <g class="doc-anim" transform="translate(236, 8)">
      <rect x="0" y="0" width="154" height="210" rx="8" fill="#FCFBF8" stroke="#E4E4E7" stroke-width="1.5" />
      <rect x="14" y="16" width="84" height="16" rx="3" fill="#FEE2E2" />
      <text x="20" y="28" style="font: 700 9px 'JetBrains Mono', monospace; fill: #991B1B;">WORD H1 · SHARD</text>

      <text x="14" y="50" style="font: 700 15px Georgia, serif; fill: #18181B;">Barbarian</text>
      <line x1="14" y1="58" x2="140" y2="58" stroke="#D4D4D8" stroke-width="1" />

      <!-- 6-Col Ability Table Preview -->
      <rect x="14" y="66" width="126" height="32" rx="3" fill="#F4F4F5" stroke="#D4D4D8" />
      <text x="22" y="79" style="font: 700 8px 'JetBrains Mono', monospace; fill: #3F3F46;">STR  DEX  CON  INT  WIS  CHA</text>
      <text x="22" y="92" style="font: 600 8px 'JetBrains Mono', monospace; fill: #18181B;">16   14   16   10   12   10</text>

      <text x="14" y="116" style="font: 700 11px Georgia, serif; fill: #18181B;">H2 · Class Features</text>
      <rect x="14" y="124" width="124" height="6" rx="2" fill="#E4E4E7" />
      <rect x="14" y="135" width="110" height="6" rx="2" fill="#E4E4E7" />
      <rect x="14" y="146" width="120" height="6" rx="2" fill="#E4E4E7" />

      <!-- Ready Badge -->
      <rect x="14" y="170" width="126" height="26" rx="4" fill="#18181B" />
      <text x="31" y="187" class="mono">barbarian.docx</text>
    </g>
  </g>
</svg>
